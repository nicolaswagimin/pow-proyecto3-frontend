<header class="cabecera">
  <a class="marca" routerLink="/">
    <svg class="marca__logo" viewBox="0 0 30 24" aria-hidden="true" focusable="false">
      <path class="marca__comillas" d="M3 9c0-3 2-5 4-5M3 9h3v4H3ZM10 9c0-3 2-5 4-5M10 9h3v4h-3Z" />
      <rect class="marca__bloque" x="17" y="7" width="11" height="13" rx="2" />
      <path class="marca__linea" d="M19.5 11h6M19.5 14.5h4" />
    </svg>
    {{ nombreApp }}
  </a>
  <ui-theme-toggle />
</header>

<div class="hoja">
  <section class="guion" aria-label="Lo que se dictó">
    <ng-content select="[auth-guion]" />
  </section>

  <main class="maqueta">
    <div class="contenido">
      <ng-content select="[auth-encabezado]" />
      <ng-content />
      <ng-content select="[auth-pie]" />
    </div>
  </main>
</div>
