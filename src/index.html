<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>VoiceToWeb</title>
    <meta name="description" content="Describe en voz alta la página que quieres y mírala armarse en vivo." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Solo los pesos que se usan: Schibsted Grotesk 400/700 (interfaz) y Newsreader 400 normal e itálica (transcripción). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Schibsted+Grotesk:wght@400;700&display=swap"
    />
    <script>
      // Aplica el tema guardado antes de pintar, para que no destelle el tema equivocado.
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.theme = tema === 'oscuro' ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
